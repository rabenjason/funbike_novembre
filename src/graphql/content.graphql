"""Administrable hero slide displayed on the home page."""
type FeaturedBanner {
  id: ID!
  short: String!
  brand: String!
  tag: String!
  image: String!
  alt: String!
  targetPage: String!
  targetId: String!
  isActive: Boolean!
  sortOrder: Int!
}

input FeaturedBannerInput {
  id: ID!
  short: String!
  brand: String!
  tag: String!
  image: String!
  alt: String!
  targetPage: String!
  targetId: String!
  isActive: Boolean
  sortOrder: Int
}

"""Configurable copy for the primary home-page hero. One record is saved for the main hero."""
type HomepageHeroCopy {
  id: ID!
  localisation: String!
  titleLine1: String!
  titleLine2: String!
  description: String!
  sloganPrefix: String!
  usages: [String!]!
  catalogButton: String!
  featuredLabel: String!
  year: String!
  chooseModelLabel: String!
  displayModelLabel: String!
}

input HomepageHeroCopyInput {
  localisation: String!
  titleLine1: String!
  titleLine2: String!
  description: String!
  sloganPrefix: String!
  usages: [String!]!
  catalogButton: String!
  featuredLabel: String!
  year: String!
  chooseModelLabel: String!
  displayModelLabel: String!
}

