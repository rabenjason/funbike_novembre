"""Administrable Funbike showroom, reseller or service point."""
type Dealer {
  key: ID!
  city: String!
  name: String!
  kind: String!
  address: String!
  hours: String!
  phone: String!
  email: String!
  desc: String!
  assistantLabel: String
  lat: Float!
  lon: Float!
  services: [String!]!
  isActive: Boolean!
  sortOrder: Int!
}

input DealerInput {
  key: ID!
  city: String!
  name: String!
  kind: String!
  address: String!
  hours: String!
  phone: String!
  email: String!
  desc: String!
  assistantLabel: String
  lat: Float!
  lon: Float!
  services: [String!]
  isActive: Boolean
  sortOrder: Int
}
