# GraphQL entry point. Backend flattens these #import statements at startup.
#import "./brands.graphql"
#import "./categories.graphql"
#import "./accessories.graphql"
#import "./motorcycles.graphql"
#import "./spare-parts.graphql"
#import "./equipment.graphql"
#import "./content.graphql"

type APIHealth {
  status: String!
  database: String!
}

type LookupRecord {
  id: ID!
  name: String!
  family: Family
  unit: String
  applicableTo: String
  isActive: Boolean!
  sortOrder: Int
}

type Query {
  health: APIHealth!
  me: User
  brands: [Brand!]!
  adminBrands: [Brand!]!
  categories: [Category!]!
  adminCategories: [Category!]!
  featuredBanners: [FeaturedBanner!]!
  adminFeaturedBanners: [FeaturedBanner!]!
  homepageHeroCopy: HomepageHeroCopy
  adminHomepageHeroCopy: HomepageHeroCopy
  homepageEditorialBanners: [HomepageEditorialBanner!]!
  homepageEditorialBannersConfigured: Boolean!
  adminHomepageEditorialBanners: [HomepageEditorialBanner!]!
  homepagePromotions: [HomepagePromotion!]!
  adminHomepagePromotions: [HomepagePromotion!]!
  dealers: [Dealer!]!
  adminDealers: [Dealer!]!
  adminLookups(kind: LookupKind!): [LookupRecord!]!
  families: [Family!]!
  subfamilies: [Subfamily!]!
  partTypes: [PartType!]!
  equipmentTypes: [EquipmentType!]!
  accessoryTypes: [AccessoryType!]!
  accessoryCategories: [AccessoryCategory!]!
  productUsages: [ProductUsage!]!
  characteristicDefinitions: [CharacteristicDefinition!]!

  motorcycles(brandId: ID, familyId: ID, search: String, limit: Int, offset: Int): [Motorcycle!]!
  spareParts(partTypeId: ID, compatibleBrandId: ID, search: String, limit: Int, offset: Int): [SparePart!]!
  equipment(brandId: ID, categoryId: ID, usageId: ID, search: String, limit: Int, offset: Int): [Equipment!]!
  gearItems(brandId: ID, categoryId: ID, usageId: ID, search: String, limit: Int, offset: Int): [Equipment!]!
  accessories(brandId: ID, categoryId: ID, search: String, limit: Int, offset: Int): [Accessory!]!
  product(id: ID!): CatalogProduct
  products(search: String, limit: Int, offset: Int): [CatalogProduct!]!
  catalogProductPage(limit: Int, offset: Int): CatalogProductPage!
  allParts(search: String, limit: Int, offset: Int): [ProductDetail!]!
  adminProducts(status: ProductStatus, kind: ProductKind, search: String, limit: Int, offset: Int): [CatalogProduct!]!
  adminProductPage(status: ProductStatus, kind: ProductKind, brandId: ID, search: String, limit: Int, offset: Int): CatalogProductPage!
  newArrivalCount: Int!
}

type Mutation {
  login(email: String!, password: String!): AuthPayload!
  changeMyEmail(currentPassword: String!, newEmail: String!): Boolean!
  changeMyPassword(currentPassword: String!, newPassword: String!): Boolean!

  createBrand(input: BrandInput!): Brand!
  updateBrand(id: ID!, input: BrandInput!): Brand!
  deleteBrand(id: ID!): Boolean!

  createCategory(input: CategoryInput!): Category!
  updateCategory(id: ID!, input: CategoryInput!): Category!
  deleteCategory(id: ID!): Boolean!

  createFeaturedBanner(input: FeaturedBannerInput!): FeaturedBanner!
  updateFeaturedBanner(id: ID!, input: FeaturedBannerInput!): FeaturedBanner!
  deleteFeaturedBanner(id: ID!): Boolean!
  saveHomepageHeroCopy(input: HomepageHeroCopyInput!): HomepageHeroCopy!
  createHomepageEditorialBanner(input: HomepageEditorialBannerInput!): HomepageEditorialBanner!
  updateHomepageEditorialBanner(id: ID!, input: HomepageEditorialBannerInput!): HomepageEditorialBanner!
  deleteHomepageEditorialBanner(id: ID!): Boolean!

  createHomepagePromotion(input: HomepagePromotionInput!): HomepagePromotion!
  updateHomepagePromotion(id: ID!, input: HomepagePromotionInput!): HomepagePromotion!
  deleteHomepagePromotion(id: ID!): Boolean!

  createDealer(input: DealerInput!): Dealer!
  updateDealer(key: ID!, input: DealerInput!): Dealer!
  deleteDealer(key: ID!): Boolean!

  createLookup(kind: LookupKind!, input: LookupInput!): LookupRecord!
  updateLookup(kind: LookupKind!, id: ID!, input: LookupInput!): LookupRecord!
  deleteLookup(kind: LookupKind!, id: ID!): Boolean!

  createProduct(input: ProductInput!): CatalogProduct!
  updateProduct(id: ID!, input: ProductInput!): CatalogProduct!
  publishProduct(id: ID!): CatalogProduct!
  unpublishProduct(id: ID!): CatalogProduct!
  deleteProduct(id: ID!): Boolean!
}
