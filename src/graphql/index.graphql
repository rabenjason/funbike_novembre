"""Vue agrégée des fiches produit hors motos, sans enum de catégorie."""
union ProductDetail = SparePart | Equipment | Accessory

"""Racines de lecture pour les entités et collections du schéma."""
type Query {
  brands: [Brand!]!
  categories: [Category!]!
  families: [Family!]!
  subfamilies: [Subfamily!]!
  partTypes: [PartType!]!
  equipmentTypes: [EquipmentType!]!
  accessoryTypes: [AccessoryType!]!
  motorcycles: [Motorcycle!]!
  spareParts: [SparePart!]!
  equipment: [Equipment!]!
  accessories: [Accessory!]!
  products: [CatalogProduct!]!
  allParts: [ProductDetail!]!
}
