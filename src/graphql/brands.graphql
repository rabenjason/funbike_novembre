"""
Marque administrable. Les produits référencent cette entité par `brand`;
les métadonnées de rubrique restent des chaînes extensibles, non des enums.
"""
type Brand {
  id: ID!
  name: String!
  logo: String!
  logoAlt: String!
  description: String
  isActive: Boolean!
  sections: [BrandSectionAssociation!]!
}

"""Métadonnées d'affichage associées à une marque dans une rubrique."""
type BrandSectionAssociation {
  section: String!
  order: Int!
  label: String
  routeId: String
  filterable: Boolean
  displayMode: String
  homeFeatured: Boolean
  footerOrder: Int
  footerFeaturedOrder: Int
}
