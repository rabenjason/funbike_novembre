"""Administrable brand record linked to products by a real relation."""
type Brand {
  id: ID!
  slug: String!
  name: String!
  logo: String
  logoAlt: String
  description: String
  isActive: Boolean!
  sortOrder: Int
  sections: [BrandSectionAssociation!]!
}

type BrandSectionAssociation {
  section: String!
  order: Int!
  label: String
  routeId: String
  filterable: Boolean
  displayMode: String
  homeFeatured: Boolean
  footerOrder: Int
  footerFeaturedOrder: Int
}
