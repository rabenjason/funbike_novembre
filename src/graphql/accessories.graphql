# Common product relationships and the separate accessory domain.
#import "./brands.graphql"
#import "./categories.graphql"

"""
Contrat commun des modèles produits. Chaque produit référence une marque et
une sous-famille comme enregistrements administrables, et non comme enums.
"""
interface CatalogProduct {
  id: ID!
  name: String!
  brand: Brand!
  subfamily: Subfamily!
  price: String!
  image: String!
}

"""Caractéristiques facultatives propres aux produits non-motos."""
type ProductSpec {
  label: String!
  value: String!
}

"""
Type d'accessoire administrable. Les enregistrements sont fournis par la future
source de données; le SDL ne préremplit aucune liste de types.
"""
type AccessoryType {
  id: ID!
  name: String!
  accessories: [Accessory!]!
}

"""
Accessoire autonome. Le frontend actuel ne contient pas encore de collection
d'accessoires distincte; ce type ne crée donc aucun enregistrement fictif.
"""
type Accessory implements CatalogProduct {
  id: ID!
  name: String!
  brand: Brand!
  subfamily: Subfamily!
  price: String!
  image: String!
  accessoryType: AccessoryType!
  sourceUrl: String
  gallery: [String!]
  desc: String
  specs: [ProductSpec!]
}
