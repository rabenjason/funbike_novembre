# Shared product contract and standalone accessory model.
#import "./brands.graphql"
#import "./categories.graphql"

enum ProductStatus {
  DRAFT
  PUBLISHED
}

"""Fixed structural product models; editable classifications remain records."""
enum ProductKind {
  MOTORCYCLE
  SPARE_PART
  EQUIPMENT
  ACCESSORY
}

enum LookupKind {
  FAMILY
  SUBFAMILY
  PART_TYPE
  EQUIPMENT_TYPE
  ACCESSORY_TYPE
  CATEGORY
  USAGE
  CHARACTERISTIC
}

type User {
  id: ID!
  email: String!
  role: String!
  isActive: Boolean!
}

type AuthPayload {
  accessToken: String!
  tokenType: String!
  expiresIn: Int!
  user: User!
}

input BrandInput {
  slug: String!
  name: String!
  logo: String
  logoAlt: String
  description: String
  isActive: Boolean
  sortOrder: Int
}

input LookupInput {
  name: String!
  familyId: ID
  unit: String
  applicableTo: String
  isActive: Boolean
  sortOrder: Int
}

input ProductImageInput {
  url: String!
  alt: String
  isPrimary: Boolean
  sortOrder: Int
}

input ProductSpecInput {
  characteristicId: ID!
  value: String!
  sortOrder: Int
}

input ProductInput {
  kind: ProductKind!
  name: String!
  reference: String
  brandId: ID
  subfamilyId: ID
  price: String
  desc: String
  familyId: ID
  tag: String
  alt: String
  recommendation: String
  partTypeId: ID
  equipmentTypeId: ID
  accessoryTypeId: ID
  categoryId: ID
  sourceUrl: String
  compatibleBrandIds: [ID!]
  universalCompatibility: Boolean
  usageIds: [ID!]
  images: [ProductImageInput!]
  specs: [ProductSpecInput!]
}

"""Common data for products. Brand and subfamily can be absent on drafts."""
interface CatalogProduct {
  id: ID!
  name: String!
  reference: String
  brand: Brand
  subfamily: Subfamily
  price: String
  image: String
  gallery: [String!]
  desc: String
  status: ProductStatus!
  publishedAt: String
}

"""Definition of an editable, reusable product characteristic."""
type CharacteristicDefinition {
  id: ID!
  name: String!
  unit: String
  applicableTo: String
  isActive: Boolean!
  sortOrder: Int
}

"""Value stored for a product; label is projected from its definition."""
type ProductSpec {
  characteristic: CharacteristicDefinition
  label: String!
  value: String!
}

type AccessoryType {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
  accessories: [Accessory!]!
}

type Accessory implements CatalogProduct {
  id: ID!
  name: String!
  reference: String
  brand: Brand
  subfamily: Subfamily
  price: String
  image: String
  gallery: [String!]
  desc: String
  status: ProductStatus!
  publishedAt: String
  accessoryType: AccessoryType
  category: AccessoryCategory
  usages: [ProductUsage!]!
  sourceUrl: String
  specs: [ProductSpec!]!
}

union ProductDetail = SparePart | Equipment | Accessory
