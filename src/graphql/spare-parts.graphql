# Spare-part types are database records, not a fixed GraphQL enum.
#import "./accessories.graphql"

"""
Type de pièce administrable depuis le futur dashboard. De nouvelles lignes
peuvent être ajoutées sans modifier ce schéma.
"""
type PartType {
  id: ID!
  name: String!
  spareParts: [SparePart!]!
}

"""
Pièce détachée ou consommable. `compatibleBrand` conserve la compatibilité
optionnelle existante, distincte de la marque propre du produit.
"""
type SparePart implements CatalogProduct {
  id: ID!
  name: String!
  brand: Brand!
  subfamily: Subfamily!
  price: String!
  image: String!
  partType: PartType!
  compatibleBrand: Brand
  gallery: [String!]
  desc: String
  specs: [ProductSpec!]
}
