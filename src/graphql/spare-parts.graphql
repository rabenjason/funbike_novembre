# Spare-part classifications are managed as database records, not enums.
#import "./accessories.graphql"

type PartType {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
  spareParts: [SparePart!]!
}

type SparePart implements CatalogProduct {
  id: ID!
  name: String!
  reference: String
  brand: Brand
  subfamily: Subfamily
  price: String
  image: String
  gallery: [String!]
  desc: String
  status: ProductStatus!
  publishedAt: String
  partType: PartType
  category: AccessoryCategory
  compatibleBrands: [Brand!]!
  universalCompatibility: Boolean
  sourceUrl: String
  specs: [ProductSpec!]!
}
