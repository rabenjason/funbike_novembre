# Pilot equipment classifications are editable records, not enums.
#import "./accessories.graphql"

type EquipmentType {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
  equipment: [Equipment!]!
}

type Equipment implements CatalogProduct {
  id: ID!
  name: String!
  reference: String
  brand: Brand
  subfamily: Subfamily
  price: String
  image: String
  gallery: [String!]
  desc: String
  status: ProductStatus!
  publishedAt: String
  equipmentType: EquipmentType
  category: AccessoryCategory
  usages: [ProductUsage!]!
  sourceUrl: String
  specs: [ProductSpec!]!
}
