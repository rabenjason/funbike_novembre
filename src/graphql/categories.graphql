"""
Liens éditoriaux de la page d'accueil (CATEGORIES). Ils restent distincts de la
taxonomie administrable Famille/Sous-famille.
"""
type Category {
  title: String!
  desc: String!
  src: String!
  to: String!
  brand: String
}

"""Famille administrable; aucune valeur de famille n'est figée dans le SDL."""
type Family {
  id: ID!
  name: String!
  subfamilies: [Subfamily!]!
}

"""
Sous-famille administrable, toujours rattachée à une famille.
Les produits référencent leur sous-famille; la famille se déduit de cette relation.
"""
type Subfamily {
  id: ID!
  name: String!
  family: Family!
}
