"""Editorial links shown on the home page; not product taxonomy."""
type Category {
  id: ID!
  title: String!
  desc: String!
  src: String!
  to: String!
  brand: String
  isActive: Boolean!
  sortOrder: Int
}

input CategoryInput {
  title: String!
  desc: String!
  src: String!
  to: String!
  brand: String
  isActive: Boolean
  sortOrder: Int
}

"""Administrable motorcycle family. Values are database records, not enums."""
type Family {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
  subfamilies: [Subfamily!]!
}

"""Optional subdivision of a family; products need not have one."""
type Subfamily {
  id: ID!
  name: String!
  family: Family!
  isActive: Boolean!
  sortOrder: Int
}

"""Browse category used by catalogue products, separate from editorial Category."""
type AccessoryCategory {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
}

"""Administrable usage label, assignable to equipment without code changes."""
type ProductUsage {
  id: ID!
  name: String!
  isActive: Boolean!
  sortOrder: Int
}
