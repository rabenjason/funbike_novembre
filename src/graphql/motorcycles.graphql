# Motorcycle-specific fields retain the Bike and BikeSpec vocabulary.
#import "./accessories.graphql"

type BikeSpec {
  characteristic: CharacteristicDefinition
  label: String!
  value: String!
}

type Motorcycle implements CatalogProduct {
  id: ID!
  name: String!
  reference: String
  brand: Brand
  subfamily: Subfamily
  price: String
  newArrivalOrder: Int
  image: String
  gallery: [String!]
  desc: String
  status: ProductStatus!
  publishedAt: String
  family: Family
  tag: String
  alt: String
  specs: [BikeSpec!]!
  recommendation: String
}
